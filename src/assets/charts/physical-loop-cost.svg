<text x="0" y="12" class="mono">MODEL COST · LIVE DESK-LAMP RUN</text><rect x="0" y="40" width="700" height="26" fill="#fbf9f4" stroke="#636b7a" stroke-width="0.75"/><rect x="0" y="40" width="121" height="26" fill="#1c3f8f"/><text x="129" y="57" class="a">$6.05 spent (11.5 min)</text><text x="692" y="57" class="b" text-anchor="end">$35 run cap</text><line x1="0" y1="66" x2="0" y2="70" stroke="#4a5262"/><text x="0" y="84" class="s">$0</text><line x1="200" y1="66" x2="200" y2="70" stroke="#4a5262"/><text x="200" y="84" class="s" text-anchor="middle">$10</text><line x1="400" y1="66" x2="400" y2="70" stroke="#4a5262"/><text x="400" y="84" class="s" text-anchor="middle">$20</text><line x1="600" y1="66" x2="600" y2="70" stroke="#4a5262"/><text x="600" y="84" class="s" text-anchor="middle">$30</text><line x1="700" y1="66" x2="700" y2="70" stroke="#4a5262"/><text x="700" y="84" class="s" text-anchor="end">$35</text><text x="0" y="110" class="s">Per-stage caps: $1 / $3 / $10 / $20. 17% of the run cap used.</text>
